notes: >
  Serval publishes an RFC 8414 OAuth 2.0 Authorization Server Metadata document at
  public.api.serval.com. It advertises a full authorization_code + PKCE (S256) flow with
  Dynamic Client Registration (registration_endpoint), refresh_token and jwt-bearer grants,
  a revocation_endpoint, and a single scope (serval:user). This is the OAuth surface behind
  the hosted MCP server (https://public.api.serval.com/mcp/). The public REST API (/v2/*)
  uses a separate HTTP Basic client_id:client_secret -> Bearer token exchange.

aid: serval
name: Serval
description: >-
  Serval is an AI-native IT service management (ITSM) platform for modern teams. It pairs an
  AI help-desk agent that resolves employee requests in Slack, Microsoft Teams, email, and a
  web portal with a separate admin-facing automation agent (Catalyst) that turns intent into
  deterministic, version-controlled TypeScript workflows. Serval covers ticketing, knowledge
  base, journeys (onboarding/offboarding), just-in-time access management with approval flows,
  campaigns, SLAs, and 130+ integrations. Its public REST API (v2), hosted MCP server, CLI,
  and webhooks let teams manage tickets, workflows, access, users, and audit logs
  programmatically, with US and EU data-residency regions.
